<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIMHEAD // SECURE GATEWAY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        :root {
            --bg-deep: #050814;
            --panel-bg: rgba(6, 11, 25, 0.88);
            --neon-pink: #ff0055;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-yellow: #fde047;
            --neon-green: #39ff14;
            --text-main: #f1f5f9;
            --text-dim: #64748b;
            --border-glow: rgba(0, 242, 254, 0.35);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
        }

        body {
            position: relative;
            background: 
                radial-gradient(circle at 50% 15%, rgba(0, 242, 254, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 15% 85%, rgba(79, 172, 254, 0.12) 0%, transparent 50%),
                linear-gradient(180deg, #020408 0%, #080d1a 100%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            perspective: 1000px;
        }

        body::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 55%;
            background-image: 
                linear-gradient(to top, rgba(0, 242, 254, 0.1) 1px, transparent 1px),
                linear-gradient(to right, rgba(0, 242, 254, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(350px) rotateX(60deg);
            transform-origin: bottom center;
            pointer-events: none;
            z-index: 0;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 10%, rgba(0,0,0,0) 90%);
        }

        .view-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #mainScreen {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        #mainScreen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        #authScreen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .brand-logo-container {
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .cyber-calligraphy-logo {
            padding: 10px 28px;
            background: rgba(6, 11, 25, 0.85);
            border: 1.5px solid var(--neon-cyan);
            border-radius: 24px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35), inset 0 0 10px rgba(0, 242, 254, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calligraphy-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(135deg, var(--neon-cyan), #ffffff, var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
            transform: skewX(-4deg);
        }

        .cyber-panel {
            width: 90%;
            max-width: 360px;
            background: var(--panel-bg);
            border: 1.5px solid var(--border-glow);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 254, 0.05);
        }

        .cyber-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 14px; height: 14px;
            border-top: 3px solid var(--neon-cyan);
            border-left: 3px solid var(--neon-cyan);
            border-top-left-radius: 14px;
            z-index: 2;
        }

        .cyber-panel::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 14px; height: 14px;
            border-bottom: 3px solid var(--neon-pink);
            border-right: 3px solid var(--neon-pink);
            border-bottom-right-radius: 14px;
            z-index: 2;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding-bottom: 10px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--neon-cyan);
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
            text-transform: uppercase;
        }

        .panel-badge {
            font-size: 10px;
            font-weight: 700;
            background: rgba(255, 0, 85, 0.15);
            color: var(--neon-pink);
            padding: 4px 8px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-label {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .auth-input {
            width: 100%;
            background: rgba(2, 4, 8, 0.75);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 8px;
            padding: 13px;
            color: var(--neon-cyan);
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), inset 0 0 5px rgba(0, 242, 254, 0.2);
        }

        .auth-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 13px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
        }

        .auth-submit-btn:hover, .auth-submit-btn:active {
            background: var(--neon-cyan);
            color: #020408;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        .error-msg {
            font-size: 10px;
            color: var(--neon-pink);
            text-align: center;
            height: 14px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 0, 85, 0.5);
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .feature-item:hover {
            border-color: rgba(0, 242, 254, 0.3);
            background: rgba(0, 242, 254, 0.03);
        }

        .feature-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 8px;
        }

        .feature-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .feature-desc {
            font-size: 10px;
            color: var(--text-dim);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.08);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px; bottom: 3px;
            background-color: #94a3b8;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(255, 0, 85, 0.3);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-pink);
        }

        .panel-footer {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        .panel-footer span:last-child {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(253, 224, 71, 0.5);
        }

        #downloadModal {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 999;
            background: rgba(2, 4, 8, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
        }

        #downloadModal .cyber-panel {
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-text {
            font-size: 12px;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
        }

        .modal-btn-group .auth-submit-btn {
            flex: 1;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.1)) !important;
            border-color: var(--neon-pink) !important;
            color: var(--neon-pink) !important;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.15) !important;
        }

        .modal-btn-confirm:hover, .modal-btn-confirm:active {
            background: var(--neon-pink) !important;
            color: #020408 !important;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8) !important;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: NHẬP KEY -->
    <div id="authScreen" class="view-screen">
        <div class="brand-logo-container">
            <div class="cyber-calligraphy-logo">
                <span class="calligraphy-text">AIMHEAD</span>
            </div>
        </div>

        <div class="cyber-panel">
            <div class="panel-header">
                <span class="panel-title">SYS // SECURITY GATEWAY</span>
                <span class="panel-badge">LOCKED</span>
            </div>
            <div class="auth-form">
                <span class="auth-label">NHẬP MÃ KÍCH HOẠT HỆ THỐNG:</span>
                <input type="text" id="keyInput" class="auth-input" placeholder="NHẬP KEY CỦA BẠN..." autocomplete="off">
                <div id="errorMsg" class="error-msg"></div>
                <button id="verifyBtn" class="auth-submit-btn">KÍCH HOẠT TRUY CẬP</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH 2: GIAO DIỆN CHÍNH -->
    <div id="mainScreen" class="view-screen">
        <div class="brand-logo-container">
            <div class="cyber-calligraphy-logo">
                <span class="calligraphy-text">AIMHEAD</span>
            </div>
        </div>

        <div class="cyber-panel">
            <div class="panel-header">
                <span class="panel-title">SYS // CONFIG.MOD</span>
                <span class="panel-badge" style="background: rgba(57,255,20,0.15); color: var(--neon-green); border-color: rgba(57,255,20,0.4); box-shadow: 0 0 10px rgba(57,255,20,0.2);">ONLINE</span>
            </div>

            <div class="feature-list">
                <div class="feature-item" data-feature="aimlock">
                    <div class="feature-info">
                        <span class="feature-name">AIM-LOCK</span>
                        <span class="feature-desc">Khóa mục tiêu tự động</span>
                    </div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>

                <div class="feature-item" data-feature="aimdrag">
                    <div class="feature-info">
                        <span class="feature-name">AIM-DRAG</span>
                        <span class="feature-desc">Hỗ trợ kéo tâm mượt mà</span>
                    </div>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <div class="panel-footer">
                <span id="statusText">TRẠNG THÁI: KẾT NỐI AN TOÀN</span>
                <span>PING: 1MS</span>
            </div>
        </div>
    </div>

    <!-- MODAL XÁC NHẬN TẢI XUỐNG -->
    <div id="downloadModal">
        <div class="cyber-panel">
            <div class="panel-header">
                <span class="panel-title">SYS // DOWNLOAD.CONFIRM</span>
                <span class="panel-badge">!</span>
            </div>
            <p class="modal-text">Tải xuống tệp cấu hình cho tính năng này?</p>
            <div class="modal-btn-group">
                <button id="modalCancel" class="auth-submit-btn">HỦY</button>
                <button id="modalOk" class="auth-submit-btn modal-btn-confirm">TẢI</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // CẤU HÌNH LINK TẢI XUỐNG
        // ============================================================
        const DOWNLOAD_LINKS = {
            aimlock: "https://github.com/user-attachments/files/33627083/AimLock.zip",
            aimdrag: "https://github.com/user-attachments/files/33627166/AimDrag.zip"
        };

        const CORRECT_KEY = "NTEX-212";

        // ============================================================
        // XỬ LÝ ĐĂNG NHẬP
        // ============================================================
        const authScreen = document.getElementById('authScreen');
        const mainScreen = document.getElementById('mainScreen');
        const keyInput = document.getElementById('keyInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const errorMsg = document.getElementById('errorMsg');

        function handleVerification() {
            const userKey = keyInput.value.trim();
            if (userKey === CORRECT_KEY) {
                authScreen.classList.add('hidden');
                setTimeout(() => {
                    authScreen.style.display = 'none';
                    mainScreen.classList.add('active');
                }, 400);
            } else {
                errorMsg.innerText = ">> LỖI: MÃ KEY KHÔNG HỢP LỆ!";
                keyInput.style.borderColor = "var(--neon-pink)";
                setTimeout(() => {
                    keyInput.style.borderColor = "rgba(0, 242, 254, 0.4)";
                }, 1500);
            }
        }

        verifyBtn.addEventListener('click', handleVerification);
        keyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleVerification();
            }
        });

        // ============================================================
        // XỬ LÝ TOGGLE + MODAL TẢI XUỐNG
        // ============================================================
        const modal = document.getElementById('downloadModal');
        const modalOk = document.getElementById('modalOk');
        const modalCancel = document.getElementById('modalCancel');
        const statusText = document.getElementById('statusText');

        let pendingToggle = null;
        let pendingFeature = null;

        document.querySelectorAll('.feature-item').forEach(item => {
            const toggle = item.querySelector('input');
            const featureKey = item.dataset.feature;

            toggle.addEventListener('change', function () {
                if (this.checked) {
                    pendingToggle = this;
                    pendingFeature = featureKey;
                    modal.style.display = 'flex';
                }
            });
        });

        modalCancel.addEventListener('click', () => {
            if (pendingToggle) pendingToggle.checked = false;
            pendingToggle = null;
            pendingFeature = null;
            modal.style.display = 'none';
        });

        modalOk.addEventListener('click', () => {
            if (pendingFeature && DOWNLOAD_LINKS[pendingFeature]) {
                // Tạo thẻ <a> ẩn để tải file trực tiếp
                const a = document.createElement('a');
                a.href = DOWNLOAD_LINKS[pendingFeature];
                a.download = pendingFeature === 'aimlock' ? 'AimLock.zip' : 'AimDrag.zip';
                a.target = '_blank';
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                if (statusText) {
                    const original = statusText.textContent;
                    statusText.textContent = "TRẠNG THÁI: ĐANG TẢI XUỐNG...";
                    statusText.style.color = "var(--neon-yellow)";
                    setTimeout(() => {
                        statusText.textContent = original;
                        statusText.style.color = "";
                    }, 2500);
                }
            } else {
                alert("Chưa cấu hình link tải xuống cho tính năng này!");
                if (pendingToggle) pendingToggle.checked = false;
            }

            pendingToggle = null;
            pendingFeature = null;
            modal.style.display = 'none';
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                if (pendingToggle) pendingToggle.checked = false;
                pendingToggle = null;
                pendingFeature = null;
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
